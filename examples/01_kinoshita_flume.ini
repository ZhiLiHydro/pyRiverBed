# pyRiverBed 2.0.0 input file
#
# Sections and keys may appear in any order. Values are
# yes/no for switches, plain numbers otherwise. Anything after
# a '#' is a comment. See THEORY_GUIDE.md for the physics and
# README.md for how to run.

# --- Which planform to work on -----------------------------------------
[run]
mode            = kinoshita                # kinoshita = synthesise a curve | centerline = read from file
centerline_file = mycenterline.txt         # two-column x y text file, used by mode = centerline
name            = kinoshita                # output file stem; empty = derive from mode / file name

# --- Channel geometry and grid resolution ------------------------------
[channel]
width                      = 0.6                      # channel width (m), constant everywhere
depth                      = 0.15                     # reach-averaged flow depth (m)
slope                      = 0                        # longitudinal channel slope; 0 = horizontal datum
transverse_slope_corrector = 1                        # (0, 1] multiplier on transverse bed slope; lower = milder bar-pool relief
ds                         = 0.03                     # streamwise node spacing (m), mode = kinoshita only
n_offsets                  = 10                       # polyline offsets per side; sets the resolution

# --- Kinoshita curve, used by mode = kinoshita only --------------------
[kinoshita]
n_bends               = 3                        # number of arc wavelengths to generate
arc_wavelength        = 10                       # arc wavelength (m)
max_angular_amplitude = 110                      # maximum angular amplitude (deg)
skewness              = 0.03125                  # streamwise asymmetry of the bends
flatness              = 0.00520833               # flattening of the bend apexes

# --- Curvature estimation and centerline smoothing ---------------------
[curvature]
method                    = arctan2                  # arctan2 | cosine | circumcircle
smoothing_level           = 20                       # Savitzky-Golay passes applied once when building the centerline; the most important number for a real river
migration_smoothing_level = 2                        # passes after each migration step; 2-8 works, below that node-scale spikes survive, above it meanders diffuse away
despike                   = yes                      # replace isolated curvature spikes

# --- Curvature phase lag (secondary-flow memory) -----------------------
[lag]
enabled  = yes                      # phase-lag the curvature signal
strength = 4                        # upstream averaging window, in channel widths

# --- Reflections -------------------------------------------------------
[flip]
streamwise = no                       # reverse the flow direction
transverse = no                       # mirror the bed about the centerline

# --- What to write and where -------------------------------------------
[output]
directory      = .                        # output directory, created if missing
save_xyz       = yes                      # riverbed point cloud (.xyz)
save_bankline  = yes                      # banklines as a closed polyline (.i2s)
save_mesh      = yes                      # FEM mesh and BC files (.t3s .dat .cli .bc2)
save_figures   = yes                      # summary figure at every graphic printout
figure_formats = png, pdf                 # formats of the headline figure
save_gif       = yes                      # assemble frames into GIFs (needs imageio)
gif_fps        = 24                       # frames per second of the GIFs
frame_dpi      = 150                      # resolution of the animation frames
figure_dpi     = 300                      # resolution of the headline figure
log_file       = pyriverbed.log           # run log inside the output directory; empty = none

# --- Meander migration (Ikeda, Parker & Sawai, 1981) -------------------
[migration]
enabled          = no                       # migrate the planform in time
n_steps          = 10000                    # number of time steps
dt               = 86400                    # time step (s)
e0               = 1e-07                    # bank erosion coefficient (1/s); the rate-setting knob
ub0              = 0                        # random inlet perturbation; needed to grow meanders from a straight channel
c0               = 0                        # deterministic inlet perturbation
cf0              = 0.01                     # reach-averaged friction coefficient
fr0              = 0.1                      # reach-averaged Froude number
end_taper_widths = 2                        # ramp bank displacement to zero over this many widths at each end; keeps the free-inlet instability out. 0 = v1.x free ends
log_every        = 50                       # time steps between progress reports
plot_every       = 100                      # time steps between figures / frames
seed             =                          # RNG seed; empty = unseeded

# --- Neck cutoffs: geometric, deterministic ----------------------------
[neck_cutoff]
enabled               = yes                      # detect neck cutoffs
min_separation_widths = 2                        # minimum along-channel separation of the two nodes (channel widths)
max_distance_widths   = 1                        # maximum straight-line distance between them (channel widths)
end_margin_widths     = 2                        # reach ends kept clear of the search (channel widths); cutoffs there are boundary artifacts. 0 = search everything, as v1.x did

# --- Chute cutoffs: geometric criteria + a random trigger --------------
[chute_cutoff]
enabled           = no                       # model chute cutoffs (needs migration)
frequency         = 0.1                      # probability per time step; 0.1 = 10% chance each step
start_step        = 2000                     # spin-up before cutoffs are allowed
entrance          = apex                     # apex | inflection
span              = 2                        # entrance points spanned; 2 = one meander loop
max_valley_angle  = 30                       # max angle with the valley axis (deg); 90 = no alignment test
min_length_widths = 10                       # minimum bypassed reach length (channel widths)
min_sinuosity     = 1.2                      # minimum sinuosity of the bypassed reach = the chute's slope advantage
end_margin        = 3                        # entrance points kept clear of the reach ends
